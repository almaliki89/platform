name: OMEGA MAX CI

on:
  push:
    branches:
      - omega-max/redesign-2026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript, curriculum and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Verify curriculum data
        run: npm run test
      - name: Build application
        run: npm run build
