<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>النموذجية في الإنكليزية - الأستاذ مصطفى تركي</title>
    <meta name="description" content="منصة تعليمية تفاعلية شاملة لمنهج اللغة الإنكليزية العراقي (الأول والثاني والثالث المتوسط، والرابع والخامس والسادس الإعدادي) مع محاكيات الامتحانات ونماذج الأسئلة بإشراف الأستاذ مصطفى تركي" />
    <meta property="og:title" content="النموذجية في الإنكليزية - الأستاذ مصطفى تركي" />
    <meta property="og:description" content="منصة تعليمية تفاعلية شاملة لمنهج اللغة الإنكليزية العراقي (الأول والثاني والثالث المتوسط، والرابع والخامس والسادس الإعدادي) مع محاكيات الامتحانات ونماذج الأسئلة بإشراف الأستاذ مصطفى تركي" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      try {
        const savedFont = localStorage.getItem('mustafa_turki_font') || 'plex';
        document.documentElement.setAttribute('data-font', savedFont);
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const docWidth = document.documentElement.offsetWidth;
          const scrollWidth = document.documentElement.scrollWidth;
          if (scrollWidth > docWidth) {
            console.log('--- OVERFLOW DEBUG ---');
            console.log('Doc Width:', docWidth, 'Scroll Width:', scrollWidth);
            const all = document.getElementsByTagName("*");
            for (let el of all) {
              if (el.offsetWidth > docWidth) {
                console.log('Overflowing Element:', el.tagName, el.className, 'Width:', el.offsetWidth);
              }
            }
          }
        }, 2000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
